name: Build optimized V4 assets

on:
  push:
    branches:
      - review/commercial-v4-final
    paths:
      - 'index.html'
      - 'img/**'
      - 'al-Adha/**'
      - '*.webp'
      - 'scripts/optimize_v4_assets.py'
      - '.github/workflows/optimize-v4-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-v4-assets
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V4 review branch
        uses: actions/checkout@v4
        with:
          ref: review/commercial-v4-final
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and CSS tools
        run: python -m pip install --upgrade Pillow rcssmin
      - name: Generate responsive WebP and self-hosted font files
        run: python scripts/optimize_v4_assets.py
      - name: Validate generated files and HTML references
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          root = Path('.')
          page = (root / 'index.html').read_text(encoding='utf-8')
          manifest = json.loads((root / 'assets/optimized/image-optimization-manifest-v4.json').read_text(encoding='utf-8'))
          missing = []
          for entry in manifest['images']:
              for item in entry['variants']:
                  if not (root / item['path']).is_file():
                      missing.append(item['path'])
          for item in manifest['fonts']:
              if not (root / item['path']).is_file():
                  missing.append(item['path'])
          refs = re.findall(r'(?:src|href|srcset|imagesrcset)="([^"]+)"', page)
          for ref in refs:
              for candidate in ref.split(','):
                  path = candidate.strip().split(' ')[0]
                  if not path or path.startswith(('http://','https://','#','data:')) or re.match(r'^[a-z][a-z0-9+.-]*:', path, re.I):
                      continue
                  if not (root / path.split('?')[0]).is_file():
                      missing.append(path)
          if missing:
              raise SystemExit('Missing local references:\n' + '\n'.join(sorted(set(missing))))
          if 'fonts.googleapis.com' in page or 'fonts.gstatic.com' in page:
              raise SystemExit('External Google Fonts request remains in HTML')
          if '1 (4).webp' not in json.dumps(manifest, ensure_ascii=False):
              raise SystemExit('Approved hero source is not present in the manifest')
          if re.search(r'<article\b[^>]*role="group"', page, re.I):
              raise SystemExit('Invalid role=group remains on an article element')
          print(f"Validated {len(manifest['images'])} image sources, {sum(len(x['variants']) for x in manifest['images'])} responsive variants and {len(manifest['fonts'])} font files.")
          PY
      - name: Commit optimized output to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/optimized assets/fonts
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Optimize V4 images and self-host Arabic font"
            git push origin HEAD:review/commercial-v4-final
          fi
